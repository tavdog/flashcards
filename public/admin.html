<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Flash Cards</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1a1d21;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --danger: #dc2626;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 650; }
  header .back {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    text-decoration: none;
    display: inline-block;
  }
  header .back:hover { border-color: var(--accent); color: var(--accent); }
  main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  .notice {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
  }
  .notice a { color: var(--accent); text-decoration: none; font-weight: 600; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  th, td { padding: 12px 16px; text-align: left; font-size: 14px; }
  th {
    background: var(--bg);
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
  }
  tr + tr td { border-top: 1px solid var(--border); }
  td.num { text-align: center; width: 80px; }
  .badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }
  td.actions { white-space: nowrap; text-align: right; width: 220px; }
  td.actions button {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  td.actions button:hover { border-color: var(--accent); color: var(--accent); }
  td.actions button.danger { margin-left: 6px; }
  td.actions button.danger:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }
</style>
</head>
<body>
<header>
  <h1>Admin — Users</h1>
  <a class="back" href="/">&larr; Back to Flash Cards</a>
</header>
<main><div id="content" class="notice">Loading&hellip;</div></main>
<script>
(async () => {
  const el = document.getElementById('content');
  let me = null;
  try { me = (await (await fetch('/api/me')).json()).user; } catch (e) {}
  if (!me) {
    el.innerHTML = 'You must be <a href="/">logged in</a> to view this page.';
    return;
  }
  const res = await fetch('/api/admin/users');
  if (res.status === 403) {
    el.textContent = 'You do not have admin access.';
    return;
  }
  if (!res.ok) {
    el.textContent = 'Failed to load users (' + res.status + ').';
    return;
  }
  const users = await res.json();
  const rows = users.map((u) => `
    <tr data-id="${u.id}" data-name="${escapeHtml(u.username)}">
      <td>#${u.id}</td>
      <td>${escapeHtml(u.username)}${u.is_admin ? ' <span class="badge">admin</span>' : ''}${u.id === me.id ? ' (you)' : ''}</td>
      <td class="num">${u.deck_count}</td>
      <td class="num">${u.card_count}</td>
      <td>${escapeHtml(fmtDate(u.created_at))}</td>
      <td class="actions">
        <button type="button" class="reset">Reset password</button>
        ${u.id === me.id ? '' : '<button type="button" class="danger del">Delete</button>'}
      </td>
    </tr>`).join('');
  el.outerHTML = `
    <table id="users">
      <thead>
        <tr><th>ID</th><th>User</th><th style="text-align:center">Decks</th><th style="text-align:center">Cards</th><th>Joined</th><th></th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
  document.getElementById('users').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const tr = btn.closest('tr');
    const id = tr.dataset.id;
    const name = tr.dataset.name;
    if (btn.classList.contains('reset')) {
      const pw = prompt(`New password for "${name}" (min 4 characters):`);
      if (pw === null) return;
      const r = await fetch(`/api/admin/users/${id}/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      alert(r.ok ? `Password reset for ${name}.` : ((await r.json()).error || 'Failed'));
    } else if (btn.classList.contains('del')) {
      if (!confirm(`Delete user "${name}"? This removes all their decks, cards, and images. Cannot be undone.`)) return;
      const r = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
      if (r.ok) location.reload();
      else alert((await r.json()).error || 'Failed to delete');
    }
  });
})();

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
  return isNaN(d) ? s : d.toLocaleDateString();
}
</script>
</body>
</html>
